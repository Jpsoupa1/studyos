<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d070"/>
      <stop offset="50%" style="stop-color:#d4a030"/>
      <stop offset="100%" style="stop-color:#b07820"/>
    </linearGradient>
    <linearGradient id="fav-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1fa0a0"/>
      <stop offset="100%" style="stop-color:#0d6060"/>
    </linearGradient>
    <linearGradient id="fav-eye" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" style="stop-color:#1a9090"/>
      <stop offset="100%" style="stop-color:#0a4a4a"/>
    </linearGradient>
  </defs>

  <!-- Hexagon fill (dark teal, semi-opaque) -->
  <polygon points="16,1.5 28,8.5 28,22.5 16,29.5 4,22.5 4,8.5"
    fill="#0a4848" opacity="0.95"/>
  <!-- Hexagon gold border -->
  <polygon points="16,1.5 28,8.5 28,22.5 16,29.5 4,22.5 4,8.5"
    fill="none" stroke="url(#fav-gold)" stroke-width="1.5"/>

  <!-- Top crown ornament -->
  <rect x="13.5" y="0.8" width="5" height="1.4" rx="0.7" fill="#d4a030"/>
  <polygon points="16,0 17.2,1.5 14.8,1.5" fill="#f5d070"/>

  <!-- Side corner dots -->
  <circle cx="4" cy="8.5" r="1" fill="#d4a030"/>
  <circle cx="28" cy="8.5" r="1" fill="#d4a030"/>
  <circle cx="4" cy="22.5" r="1" fill="#d4a030"/>
  <circle cx="28" cy="22.5" r="1" fill="#d4a030"/>

  <!-- Ear tufts -->
  <polygon points="11.2,9.5 9.5,5.5 13.2,8.5" fill="url(#fav-teal)"/>
  <polygon points="11.2,9.5 9.8,5.8 12.8,8.3" fill="none" stroke="#d4a030" stroke-width="0.7"/>
  <polygon points="20.8,9.5 22.5,5.5 18.8,8.5" fill="url(#fav-teal)"/>
  <polygon points="20.8,9.5 22.2,5.8 19.2,8.3" fill="none" stroke="#d4a030" stroke-width="0.7"/>

  <!-- Owl body -->
  <ellipse cx="16" cy="16.5" rx="7" ry="8" fill="url(#fav-teal)"/>
  <!-- Chest detail -->
  <ellipse cx="16" cy="18" rx="3.5" ry="5" fill="none" stroke="#d4a030" stroke-width="0.6" opacity="0.5"/>

  <!-- Brow lines -->
  <path d="M9.5,11.2 Q12.5,10 14.5,11.8" fill="none" stroke="#d4a030" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M22.5,11.2 Q19.5,10 17.5,11.8" fill="none" stroke="#d4a030" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Eye gold rings -->
  <circle cx="12.5" cy="14" r="3.6" fill="url(#fav-gold)"/>
  <circle cx="19.5" cy="14" r="3.6" fill="url(#fav-gold)"/>

  <!-- Eye inner teal -->
  <circle cx="12.5" cy="14" r="2.5" fill="url(#fav-eye)"/>
  <circle cx="19.5" cy="14" r="2.5" fill="url(#fav-eye)"/>

  <!-- Pupils -->
  <circle cx="12.5" cy="14" r="1.1" fill="#061c1c"/>
  <circle cx="19.5" cy="14" r="1.1" fill="#061c1c"/>

  <!-- Eye shines -->
  <circle cx="11.5" cy="13" r="0.75" fill="#e8e4d0" opacity="0.9"/>
  <circle cx="18.5" cy="13" r="0.75" fill="#e8e4d0" opacity="0.9"/>

  <!-- Beak -->
  <polygon points="16,16 14.5,17.8 17.5,17.8" fill="url(#fav-gold)"/>

  <!-- Crossed pen (left diagonal) -->
  <line x1="3.5" y1="25.5" x2="22" y2="20.5" stroke="url(#fav-gold)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pen nib -->
  <polygon points="22,20.5 24,19 22.5,21.5" fill="#d4a030"/>
  <!-- Pen end cap -->
  <ellipse cx="4" cy="25.8" rx="1.5" ry="1" fill="#d4a030" transform="rotate(-15,4,25.8)"/>

  <!-- Crossed pencil (right diagonal) -->
  <line x1="28.5" y1="25.5" x2="10" y2="20.5" stroke="url(#fav-gold)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pencil tip -->
  <polygon points="10,20.5 8,19 9.5,21.5" fill="#1fa0a0"/>
  <!-- Pencil eraser end -->
  <ellipse cx="28" cy="25.8" rx="1.5" ry="1" fill="#d08080" opacity="0.85" transform="rotate(15,28,25.8)"/>

  <!-- Center intersection gem -->
  <circle cx="16" cy="22.5" r="1.4" fill="#f5d070"/>
  <circle cx="16" cy="22.5" r="0.7" fill="#fffbe0"/>
</svg>
