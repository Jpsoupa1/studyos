<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ic-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7d878"/>
      <stop offset="45%" style="stop-color:#d4a030"/>
      <stop offset="100%" style="stop-color:#a06818"/>
    </linearGradient>
    <linearGradient id="ic-goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe898"/>
      <stop offset="50%" style="stop-color:#d4a030"/>
      <stop offset="100%" style="stop-color:#9a6010"/>
    </linearGradient>
    <linearGradient id="ic-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22a8a8"/>
      <stop offset="100%" style="stop-color:#0b5858"/>
    </linearGradient>
    <linearGradient id="ic-tealDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e6868"/>
      <stop offset="100%" style="stop-color:#083838"/>
    </linearGradient>
    <radialGradient id="ic-eye" cx="38%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#20a0a0"/>
      <stop offset="100%" style="stop-color:#093838"/>
    </radialGradient>
    <radialGradient id="ic-hexFill" cx="50%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#104848"/>
      <stop offset="100%" style="stop-color:#072828"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="ic-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="ic-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d4a030" flood-opacity="0.7"/>
    </filter>
    <filter id="ic-eyeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#20c0c0" flood-opacity="0.5"/>
    </filter>
    <filter id="ic-textShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════
       HEXAGON FRAME
  ═══════════════════════════════════════ -->

  <!-- Hexagon outer shadow layer -->
  <polygon points="256,38 388,113 388,263 256,338 124,263 124,113"
    fill="#000" opacity="0.3" transform="translate(5,8)"/>

  <!-- Hexagon main fill -->
  <polygon points="256,38 388,113 388,263 256,338 124,263 124,113"
    fill="url(#ic-hexFill)" filter="url(#ic-drop)"/>

  <!-- Hexagon outer gold border -->
  <polygon points="256,38 388,113 388,263 256,338 124,263 124,113"
    fill="none" stroke="url(#ic-gold)" stroke-width="9" filter="url(#ic-glow)"/>

  <!-- Hexagon inner thin border -->
  <polygon points="256,52 374,120 374,252 256,320 138,252 138,120"
    fill="none" stroke="#d4a030" stroke-width="2" opacity="0.45"/>

  <!-- ── Corner accent gems ── -->
  <circle cx="256" cy="38"  r="7" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <circle cx="388" cy="113" r="7" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <circle cx="388" cy="263" r="7" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <circle cx="256" cy="338" r="7" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <circle cx="124" cy="263" r="7" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <circle cx="124" cy="113" r="7" fill="url(#ic-gold)" filter="url(#ic-glow)"/>

  <!-- ── Top crown ornament ── -->
  <rect x="234" y="24" width="44" height="14" rx="4" fill="url(#ic-goldV)"/>
  <rect x="244" y="14" width="24" height="12" rx="3" fill="url(#ic-goldV)"/>
  <polygon points="256,6 263,16 249,16" fill="#f7d878"/>
  <!-- Crown gems row -->
  <circle cx="244" cy="31" r="3" fill="#fffbe0" opacity="0.7"/>
  <circle cx="256" cy="31" r="4" fill="#fffbe0" opacity="0.85"/>
  <circle cx="268" cy="31" r="3" fill="#fffbe0" opacity="0.7"/>

  <!-- ── Side filigree scrollwork ── -->
  <!-- Left -->
  <path d="M138,140 Q122,160 134,182 Q146,204 130,226 Q118,245 134,262"
    fill="none" stroke="#d4a030" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  <path d="M148,150 Q136,168 144,186 Q152,204 142,220"
    fill="none" stroke="#d4a030" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  <circle cx="130" cy="182" r="3" fill="#d4a030" opacity="0.5"/>
  <!-- Right -->
  <path d="M374,140 Q390,160 378,182 Q366,204 382,226 Q394,245 378,262"
    fill="none" stroke="#d4a030" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  <path d="M364,150 Q376,168 368,186 Q360,204 370,220"
    fill="none" stroke="#d4a030" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  <circle cx="382" cy="182" r="3" fill="#d4a030" opacity="0.5"/>

  <!-- ═══════════════════════════════════════
       OWL BODY
  ═══════════════════════════════════════ -->

  <!-- Wing shadow hints -->
  <path d="M170,225 Q182,205 198,218 Q184,238 170,248 Z" fill="#0a4040" opacity="0.8"/>
  <path d="M342,225 Q330,205 314,218 Q328,238 342,248 Z" fill="#0a4040" opacity="0.8"/>

  <!-- Main body oval -->
  <ellipse cx="256" cy="210" rx="88" ry="98" fill="url(#ic-teal)" filter="url(#ic-drop)"/>

  <!-- Chest lighter belly -->
  <ellipse cx="256" cy="222" rx="44" ry="62" fill="#0e7070" opacity="0.7"/>
  <!-- Belly ring detail -->
  <ellipse cx="256" cy="226" rx="30" ry="46" fill="none" stroke="#d4a030" stroke-width="1.5" opacity="0.4"/>

  <!-- Feather texture lines (subtle) -->
  <path d="M220,200 Q230,195 240,200 Q230,210 220,215 Z" fill="#0b5858" opacity="0.4"/>
  <path d="M292,200 Q282,195 272,200 Q282,210 292,215 Z" fill="#0b5858" opacity="0.4"/>
  <path d="M215,230 Q226,224 236,230 Q226,241 215,246 Z" fill="#0b5858" opacity="0.3"/>
  <path d="M297,230 Q286,224 276,230 Q286,241 297,246 Z" fill="#0b5858" opacity="0.3"/>

  <!-- ── EAR TUFTS ── -->
  <!-- Left tuft -->
  <polygon points="218,122 204,86 238,114" fill="url(#ic-teal)"/>
  <polygon points="218,122 206,90 234,112" fill="none" stroke="#d4a030" stroke-width="2"/>
  <!-- Right tuft -->
  <polygon points="294,122 308,86 274,114" fill="url(#ic-teal)"/>
  <polygon points="294,122 306,90 278,112" fill="none" stroke="#d4a030" stroke-width="2"/>

  <!-- ── BROW RIDGES (stern expression) ── -->
  <path d="M198,158 Q224,148 244,160" fill="none" stroke="#d4a030" stroke-width="4" stroke-linecap="round"/>
  <path d="M314,158 Q288,148 268,160" fill="none" stroke="#d4a030" stroke-width="4" stroke-linecap="round"/>

  <!-- ── EYES ── -->
  <!-- Left eye: outer gold ring -->
  <circle cx="224" cy="182" r="38" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <!-- Left eye: inner teal iris -->
  <circle cx="224" cy="182" r="27" fill="url(#ic-eye)" filter="url(#ic-eyeGlow)"/>
  <!-- Left eye: iris ring detail -->
  <circle cx="224" cy="182" r="28" fill="none" stroke="#f5d070" stroke-width="1.5" opacity="0.5"/>
  <!-- Left eye: pupil -->
  <circle cx="224" cy="182" r="13" fill="#050f0f"/>
  <!-- Left eye: shine -->
  <circle cx="214" cy="172" r="7"  fill="#e8e4d0" opacity="0.9"/>
  <circle cx="219" cy="177" r="3"  fill="#ffffff" opacity="0.6"/>

  <!-- Right eye: outer gold ring -->
  <circle cx="288" cy="182" r="38" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <!-- Right eye: inner teal iris -->
  <circle cx="288" cy="182" r="27" fill="url(#ic-eye)" filter="url(#ic-eyeGlow)"/>
  <!-- Right eye: iris ring detail -->
  <circle cx="288" cy="182" r="28" fill="none" stroke="#f5d070" stroke-width="1.5" opacity="0.5"/>
  <!-- Right eye: pupil -->
  <circle cx="288" cy="182" r="13" fill="#050f0f"/>
  <!-- Right eye: shine -->
  <circle cx="278" cy="172" r="7"  fill="#e8e4d0" opacity="0.9"/>
  <circle cx="283" cy="177" r="3"  fill="#ffffff" opacity="0.6"/>

  <!-- ── BEAK ── -->
  <polygon points="256,203 238,226 274,226" fill="url(#ic-goldV)"/>
  <!-- Beak center crease -->
  <line x1="242" y1="218" x2="270" y2="218" stroke="#9a6010" stroke-width="1.5" opacity="0.6"/>

  <!-- ═══════════════════════════════════════
       CROSSED PEN & PENCIL
  ═══════════════════════════════════════ -->

  <!-- Drop shadows for tools -->
  <line x1="74"  y1="328" x2="328" y2="264" stroke="#000" stroke-width="26" stroke-linecap="round" opacity="0.3" transform="translate(4,6)"/>
  <line x1="438" y1="328" x2="184" y2="264" stroke="#000" stroke-width="26" stroke-linecap="round" opacity="0.3" transform="translate(4,6)"/>

  <!-- ── FOUNTAIN PEN (lower-left → upper-right) ── -->
  <g transform="rotate(-18, 200, 300)">
    <!-- Barrel body -->
    <rect x="80" y="288" width="240" height="22" rx="11" fill="url(#ic-tealDark)"/>
    <!-- Barrel gold outline -->
    <rect x="80" y="288" width="240" height="22" rx="11" fill="none" stroke="url(#ic-gold)" stroke-width="2.5"/>
    <!-- Barrel shine stripe -->
    <rect x="90" y="290" width="220" height="5" rx="2.5" fill="#ffffff" opacity="0.08"/>
    <!-- Gold band rings -->
    <rect x="168" y="288" width="10" height="22" rx="0" fill="#d4a030" opacity="0.8"/>
    <rect x="200" y="288" width="6"  height="22" rx="0" fill="#d4a030" opacity="0.6"/>
    <!-- Clip -->
    <rect x="210" y="285" width="7" height="26" rx="3" fill="url(#ic-goldV)"/>
    <!-- Nib (right side - upper right) -->
    <polygon points="320,299 338,289 334,309" fill="url(#ic-goldV)"/>
    <line x1="320" y1="299" x2="335" y2="299" stroke="#9a6010" stroke-width="1" opacity="0.6"/>
    <!-- Cap end (left) -->
    <ellipse cx="90" cy="299" rx="14" ry="11" fill="url(#ic-gold)"/>
    <circle cx="90" cy="299" r="5" fill="#f7d878" opacity="0.6"/>
  </g>

  <!-- ── PENCIL (lower-right → upper-left) ── -->
  <g transform="rotate(18, 312, 300)">
    <!-- Pencil body -->
    <rect x="192" y="288" width="236" height="22" rx="4" fill="url(#ic-tealDark)"/>
    <!-- Pencil outline -->
    <rect x="192" y="288" width="236" height="22" rx="4" fill="none" stroke="url(#ic-gold)" stroke-width="2.5"/>
    <!-- Pencil barrel shine -->
    <rect x="200" y="290" width="210" height="5" rx="2" fill="#ffffff" opacity="0.08"/>
    <!-- Ferrule (metal band near eraser) -->
    <rect x="390" y="288" width="16" height="22" fill="#d4a030" opacity="0.9"/>
    <rect x="390" y="288" width="16" height="22" fill="none" stroke="#f7d878" stroke-width="1" opacity="0.5"/>
    <!-- Eraser (right end) -->
    <rect x="406" y="290" width="20" height="18" rx="4" fill="#d08080" opacity="0.85"/>
    <!-- Pencil wood cone (left tip) -->
    <polygon points="192,299 214,288 214,310" fill="#c8a060"/>
    <!-- Pencil graphite tip -->
    <polygon points="192,299 207,294 207,304" fill="#383838"/>
  </g>

  <!-- Center cross gem -->
  <circle cx="256" cy="294" r="12" fill="url(#ic-gold)" filter="url(#ic-glow)"/>
  <circle cx="256" cy="294" r="7"  fill="#f7d878"/>
  <circle cx="256" cy="294" r="3"  fill="#fffbe0"/>

  <!-- ═══════════════════════════════════════
       "Study OS" TEXT
  ═══════════════════════════════════════ -->

  <!-- Text drop shadow -->
  <text x="256" y="406"
    text-anchor="middle"
    font-family="Georgia, 'Book Antiqua', Palatino, serif"
    font-size="76" font-weight="bold" letter-spacing="5"
    fill="#000" opacity="0.4" transform="translate(3,5)">Study OS</text>

  <!-- Main gold text -->
  <text x="256" y="406"
    text-anchor="middle"
    font-family="Georgia, 'Book Antiqua', Palatino, serif"
    font-size="76" font-weight="bold" letter-spacing="5"
    fill="url(#ic-goldV)" filter="url(#ic-glow)">Study OS</text>

  <!-- ── Text underline ornament ── -->
  <line x1="148" y1="422" x2="364" y2="422" stroke="url(#ic-gold)" stroke-width="2" opacity="0.65"/>
  <circle cx="148" cy="422" r="4" fill="#d4a030"/>
  <circle cx="256" cy="422" r="5" fill="#f7d878" filter="url(#ic-glow)"/>
  <circle cx="364" cy="422" r="4" fill="#d4a030"/>

  <!-- ── Subtitle / tagline dots ── -->
  <circle cx="214" cy="440" r="2" fill="#d4a030" opacity="0.5"/>
  <circle cx="256" cy="440" r="2" fill="#d4a030" opacity="0.7"/>
  <circle cx="298" cy="440" r="2" fill="#d4a030" opacity="0.5"/>

  <!-- ── Bottom corner flourishes ── -->
  <path d="M80,470 Q100,452 120,470" fill="none" stroke="#d4a030" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M392,470 Q412,452 432,470" fill="none" stroke="#d4a030" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <circle cx="80" cy="470" r="3" fill="#d4a030" opacity="0.4"/>
  <circle cx="432" cy="470" r="3" fill="#d4a030" opacity="0.4"/>
</svg>
